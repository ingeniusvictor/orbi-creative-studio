name: ORBI Phase 0 Linux desktop launch smoke

on:
  push:
    branches:
      - cert/phase-0-linux-launch
    paths:
      - .github/workflows/orbi-phase-0-linux-launch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify workflow-only divergence
        env:
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
          PINNED_TREE: 3b4c89a044621ea677d9ceb477f301301a704cdf
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PINNED_COMMIT^{tree}")" = "$PINNED_TREE"
          changed="$(git diff --name-only "$PINNED_COMMIT"..HEAD)"
          test "$changed" = ".github/workflows/orbi-phase-0-linux-launch.yml"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build unpacked desktop app
        run: |
          npm ci
          npm run build:packages
          npm run vite:build
          npx electron-builder --linux --dir --publish never

      - name: Verify xvfb availability
        run: |
          command -v xvfb-run
          command -v Xvfb

      - name: Launch Electron app under virtual display
        shell: bash
        run: |
          set -euo pipefail
          exe="release/linux-unpacked/open-generative-ai"
          test -x "$exe"
          export ELECTRON_DISABLE_SANDBOX=1
          xvfb-run -a "$exe" --no-sandbox > /tmp/orbi-electron.log 2>&1 &
          wrapper_pid=$!
          echo "XVFB_WRAPPER_PID=$wrapper_pid"
          sleep 12

          app_pids="$(pgrep -f 'release/linux-unpacked/open-generative-ai' || true)"
          echo "APP_PIDS=$app_pids"

          if [ -z "$app_pids" ]; then
            echo "No live Open Generative AI process after 12-second stability window."
            cat /tmp/orbi-electron.log || true
            exit 1
          fi

          echo "DESKTOP_CHILD_PROCESS_SMOKE_PASS"
          ps -fp $app_pids || true

          kill $app_pids 2>/dev/null || true
          kill "$wrapper_pid" 2>/dev/null || true
          sleep 2
          cat /tmp/orbi-electron.log || true
