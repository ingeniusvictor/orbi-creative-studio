name: ORBI Phase 0 lint certification

on:
  push:
    branches:
      - cert/phase-0-lint
    paths:
      - .github/workflows/orbi-phase-0-lint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify workflow-only divergence
        env:
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
          PINNED_TREE: 3b4c89a044621ea677d9ceb477f301301a704cdf
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PINNED_COMMIT^{tree}")" = "$PINNED_TREE"
          changed="$(git diff --name-only "$PINNED_COMMIT"..HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = ".github/workflows/orbi-phase-0-lint.yml"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Run declared lint script
        run: npm run lint
