name: ORBI Compute Router contracts P1B validation

on:
  push:
    branches:
      - feature/compute-router-contracts-p1b
  pull_request:
    branches:
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout router contracts
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Router isolation static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/computeRouter/contracts.mjs', 'utf8');
          const banned = ['fetch(', 'axios', 'localStorage', 'window.', 'ipcRenderer', 'ipcMain', 'muapi.ai'];
          const hits = banned.filter((token) => source.includes(token));
          if (hits.length) throw new Error('Router contracts contain execution/UI coupling: ' + hits.join(', '));
          if (!source.includes('NO_ELIGIBLE_PROVIDER')) throw new Error('Structured no-provider result missing');
          if (!source.includes("privacy: requireEnum")) throw new Error('Privacy policy validation missing');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1B_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
