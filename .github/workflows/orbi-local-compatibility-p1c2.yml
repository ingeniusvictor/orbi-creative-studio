name: ORBI Local compatibility snapshot P1C2 validation

on:
  push:
    branches:
      - feature/local-compatibility-snapshot-p1c2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1C2
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: P1C2 static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/computeRouter/localCompatibility.mjs', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          for (const token of [
            "from 'node:fs'",
            "from 'node:child_process'",
            'fetch(',
            'ipcRenderer',
            'ipcMain',
            'localStorage',
            'sessionStorage',
            'routeGenerationRequest(',
            'localAI.generate',
            'muapi.generate',
          ]) {
            if (source.includes(token)) {
              throw new Error('P1C2 contains forbidden side effect: ' + token);
            }
          }

          for (const token of [
            "LOCAL_COMPATIBILITY_EXECUTION_AUTHORITY = 'legacy-dispatcher-only'",
            'routingEligible: false',
            'cutoverAuthorized: false',
            "'COMPATIBILITY_CANDIDATE'",
            "'COMPATIBILITY_BLOCKED'",
            "'COMPATIBILITY_UNKNOWN'",
            "'INSTALLED_RUNTIME_PROVENANCE_UNVERIFIED'",
            "'INSUFFICIENT_SYSTEM_RAM'",
            "'INSUFFICIENT_VRAM'",
          ]) {
            if (!source.includes(token)) {
              throw new Error('P1C2 invariant missing: ' + token);
            }
          }

          if (image.includes('localCompatibility') || video.includes('localCompatibility')) {
            throw new Error('P1C2 must not be imported into Studio execution');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: P1C2 focused tests
        run: node --test tests/localCompatibility.test.js tests/hardwareCapabilityProbe.test.js tests/providerReadinessSnapshot.test.js tests/runtimeProvenance.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1C2_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
