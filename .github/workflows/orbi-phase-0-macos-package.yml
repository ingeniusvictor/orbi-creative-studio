name: ORBI Phase 0 macOS package certification

on:
  push:
    branches:
      - cert/phase-0-macos-package
    paths:
      - .github/workflows/orbi-phase-0-macos-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout pinned baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify workflow-only divergence
        env:
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
          PINNED_TREE: 3b4c89a044621ea677d9ceb477f301301a704cdf
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PINNED_COMMIT^{tree}")" = "$PINNED_TREE"
          changed="$(git diff --name-only "$PINNED_COMMIT"..HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = ".github/workflows/orbi-phase-0-macos-package.yml"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Build required workspaces
        run: npm run build:packages

      - name: Build macOS Electron package
        run: |
          npm run vite:build
          npx electron-builder --mac --publish never

      - name: Inventory package outputs
        run: |
          set -euo pipefail
          find release -maxdepth 2 -type f -print0 | xargs -0 stat -f "%N %z bytes" | sort
          echo
          echo "SHA-256:"
          find release -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r shasum -a 256
