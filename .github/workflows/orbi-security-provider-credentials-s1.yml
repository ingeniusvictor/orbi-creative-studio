name: ORBI Security provider credential Stage S1 validation

on:
  push:
    branches:
      - security/provider-credential-access-s1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout credential branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Electron syntax gate
        run: find electron -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Credential boundary static gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const roots=['src/lib','src/components'];
          const allowed=path.normalize('src/lib/providerCredentials.mjs');
          const violations=[];
          const patterns=[
            /localStorage\.(?:getItem|setItem|removeItem)\(\s*['"]muapi_key['"]/,
            /window\.__MUAPI_KEY__/,
          ];
          function walk(dir){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(p);
              else if(/\.(?:js|mjs|jsx)$/.test(entry.name) && path.normalize(p)!==allowed){
                const text=fs.readFileSync(p,'utf8');
                if(patterns.some(rx=>rx.test(text))) violations.push(p);
              }
            }
          }
          roots.forEach(walk);
          console.log('CREDENTIAL_BOUNDARY_VIOLATIONS',JSON.stringify(violations));
          if(violations.length) throw new Error('Direct MuAPI credential storage access remains outside providerCredentials');
          NODE

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a=require('/tmp/prod-audit.json');
          const v=a.metadata?.vulnerabilities || {};
          console.log('PROVIDER_CREDENTIAL_S1_PROD_AUDIT',JSON.stringify(v));
          if((v.critical||0)>0 || (v.high||0)>0) throw new Error('Critical/high production findings remain');
          NODE
