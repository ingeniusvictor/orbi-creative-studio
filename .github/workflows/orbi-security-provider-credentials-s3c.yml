name: ORBI Security desktop credential cutover S3C validation

on:
  push:
    branches:
      - security/provider-credential-desktop-s3c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout S3C branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: S3C credential cutover static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'src/components/ImageStudio.js',
            'src/components/VideoStudio.js',
            'src/components/LipSyncStudio.js',
            'src/components/CinemaStudio.js',
            'src/components/UploadPicker.js',
          ];

          const violations = files.filter((file) => {
            const text = fs.readFileSync(file, 'utf8');
            return /getMuapiKey/.test(text);
          });
          if (violations.length) {
            throw new Error('Studio raw credential reads remain: ' + violations.join(', '));
          }

          const credentials = fs.readFileSync('src/lib/providerCredentials.mjs', 'utf8');
          if (!credentials.includes('if (isDesktopCredentialRuntime()) return null;')) {
            throw new Error('Electron getMuapiKey fail-closed guard is missing');
          }
          if (!credentials.includes('await bridge.setMuapiKey(legacyKey)')) {
            throw new Error('One-time secure migration is missing');
          }
          if (!credentials.includes('clearLegacyStorage();')) {
            throw new Error('Legacy renderer storage cleanup is missing');
          }

          const preload = fs.readFileSync('electron/preload.js', 'utf8');
          if (/getSecret|getMuapiKey/.test(preload)) {
            throw new Error('Preload exposes or references a provider secret read');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Electron syntax gate
        run: find electron -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('S3C_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
