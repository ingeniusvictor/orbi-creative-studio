name: ORBI Desktop hardware capability probe P1C validation

on:
  push:
    branches:
      - feature/desktop-hardware-capability-probe-p1c
  pull_request:
    branches:
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout hardware probe
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Hardware probe security static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('electron/lib/hardwareCapabilityProbe.js', 'utf8');
          if (source.includes('execSync(')) throw new Error('Shell-style execSync is forbidden');
          if (source.includes('spawn(')) throw new Error('Unexpected generic spawn path');
          if (!source.includes('ALLOWED_COMMANDS')) throw new Error('Fixed command allowlist missing');
          if (!source.includes('COMMAND_TIMEOUT_MS')) throw new Error('Command timeout missing');
          if (!source.includes('COMMAND_MAX_BUFFER')) throw new Error('Command output bound missing');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Electron syntax gate
        run: node --check electron/lib/hardwareCapabilityProbe.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1C_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
