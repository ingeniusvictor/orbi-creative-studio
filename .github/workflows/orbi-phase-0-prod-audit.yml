name: ORBI Phase 0 production dependency audit

on:
  push:
    branches:
      - cert/phase-0-prod-audit
    paths:
      - .github/workflows/orbi-phase-0-prod-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify workflow-only divergence
        env:
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
          PINNED_TREE: 3b4c89a044621ea677d9ceb477f301301a704cdf
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PINNED_COMMIT^{tree}")" = "$PINNED_TREE"
          changed="$(git diff --name-only "$PINNED_COMMIT"..HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = ".github/workflows/orbi-phase-0-prod-audit.yml"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Production-only npm audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          status=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/prod-audit.json','utf8'));
          console.log(JSON.stringify({
            vulnerabilities:a.metadata?.vulnerabilities || null,
            dependencies:a.metadata?.dependencies || null
          }, null, 2));
          const vulns=a.vulnerabilities || {};
          const rows=Object.entries(vulns).map(([name,v])=>({
            name,
            severity:v.severity,
            direct:v.isDirect,
            via:Array.isArray(v.via)?v.via.map(x=>typeof x==='string'?x:(x.title||x.name||x.source)).slice(0,10):v.via,
            fixAvailable:v.fixAvailable
          }));
          rows.sort((a,b)=>({critical:4,high:3,moderate:2,low:1,info:0}[b.severity]||0)-({critical:4,high:3,moderate:2,low:1,info:0}[a.severity]||0));
          console.log("PRODUCTION_VULNERABILITY_ROWS");
          console.log(JSON.stringify(rows,null,2));
          NODE
          echo "npm audit exit code: $status"
          exit 0
