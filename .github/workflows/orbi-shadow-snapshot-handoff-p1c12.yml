name: ORBI Shadow snapshot handoff P1C12 validation

on:
  push:
    branches:
      - feature/shadow-snapshot-handoff-p1c12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1C12
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: P1C12 static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const handoff = fs.readFileSync('src/lib/computeRouter/shadowCompatibilitySnapshotHandoff.mjs', 'utf8');
          const settings = fs.readFileSync('src/components/SettingsModal.js', 'utf8');
          const panel = fs.readFileSync('src/components/RouterDiagnosticsPanel.js', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');
          const main = fs.readFileSync('src/main.js', 'utf8');

          for (const token of [
            'node:fs',
            "from 'fs'",
            'fetch(',
            'ipcMain',
            'ipcRenderer',
            'localStorage',
            'sessionStorage',
            'indexedDB',
            'routeGenerationRequest',
            'certifiedResourceProfileRegistry',
          ]) {
            if (handoff.includes(token)) throw new Error('P1C12 handoff has forbidden capability: ' + token);
          }

          for (const token of [
            'validateShadowCompatibilitySnapshot',
            'cloneFrozenSnapshot',
            'HANDOFF_SNAPSHOT_OLDER_THAN_CURRENT',
            'HANDOFF_TIMESTAMP_CONFLICT',
            'diagnosticOnly: true',
            'routingEligible: false',
            'cutoverAuthorized: false',
            "executionAuthority: 'legacy-dispatcher-only'",
          ]) {
            if (!handoff.includes(token)) throw new Error('P1C12 handoff invariant missing: ' + token);
          }

          if (!settings.includes('shadowCompatibilitySnapshotProvider: readShadowCompatibilitySnapshot')) {
            throw new Error('Settings is not connected to the read-only handoff reader');
          }
          if (settings.includes('publishShadowCompatibilitySnapshot')) {
            throw new Error('Settings must not receive the handoff writer');
          }
          if (!panel.includes('shadowCompatibilitySnapshotProvider = null')
              || !panel.includes('return provider();')
              || !panel.includes('refresh.onclick = render')) {
            throw new Error('Router diagnostics dynamic read-only provider contract missing');
          }
          if ((panel.match(/\.onclick\s*=/g) || []).length !== 1) {
            throw new Error('Refresh must remain the only RouterDiagnosticsPanel onclick action');
          }

          for (const source of [image, video, main]) {
            if (source.includes('shadowCompatibilitySnapshotHandoff')
                || source.includes('publishShadowCompatibilitySnapshot')) {
              throw new Error('P1C12 handoff entered startup/generation surfaces');
            }
          }

          const p1b13 = fs.readFileSync('.github/workflows/orbi-router-diagnostics-panel-p1b13.yml', 'utf8');
          if (/\n\s*pull_request\s*:/.test(p1b13)) {
            throw new Error('Residual P1B13 pull_request fan-out returned');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: P1C12 focused tests
        run: node --test tests/shadowSnapshotHandoff.test.js tests/shadowDiagnosticsUi.test.js tests/routerDiagnosticsPanel.test.js tests/shadowCompatibilityDiagnostics.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1C12_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
