name: ORBI P1C66 Hardware Pilot Import UI

on:
  pull_request:
    paths:
      - 'src/components/HardwarePilotImportPanel.js'
      - 'src/components/SettingsModal.js'
      - 'tests/hardwarePilotImportUi.test.js'
      - 'docs/PHASE-1C66-HARDWARE-PILOT-IMPORT-UI.md'
      - '.github/workflows/orbi-hardware-pilot-import-ui-p1c66.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hardwarePilotImportUi.test.js
