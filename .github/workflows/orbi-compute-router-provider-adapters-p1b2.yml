name: ORBI Compute Router provider adapters P1B2 validation

on:
  push:
    branches:
      - feature/compute-router-provider-adapters-p1b2
  pull_request:
    branches:
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout provider adapters
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Adapter isolation static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/computeRouter/providerAdapters.mjs', 'utf8');
          const banned = [
            'fetch(',
            'axios',
            'ipcRenderer',
            'ipcMain',
            'window.',
            'localStorage',
            'child_process',
            'execFile',
            'spawn(',
          ];
          const hits = banned.filter((token) => source.includes(token));
          if (hits.length) {
            throw new Error('Provider adapters contain execution/runtime coupling: ' + hits.join(', '));
          }
          if (!source.includes("'sdcpp-device'")) throw new Error('sd.cpp provider identity missing');
          if (!source.includes("'wan2gp-lan'")) throw new Error('Wan2GP provider identity missing');
          if (!source.includes("'muapi-cloud'")) throw new Error('MuAPI provider identity missing');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Router/provider tests
        run: node --test tests/computeRouterContracts.test.js tests/computeRouterProviderAdapters.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1B2_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
