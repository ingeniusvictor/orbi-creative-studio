name: ORBI P1C51 Pinned Runtime Compatibility

on:
  pull_request:
    paths:
      - 'electron/lib/localInference.js'
      - 'electron/lib/modelCatalog.js'
      - 'scripts/stage-local-ai-binary.js'
      - 'tests/stageLocalAiBinary.test.js'
      - 'tests/localInferenceCliCompatibility.test.js'
      - 'docs/PHASE-1C51-PINNED-RUNTIME-COMPATIBILITY.md'
      - '.github/workflows/orbi-pinned-runtime-compat-p1c51.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/stageLocalAiBinary.test.js tests/localInferenceCliCompatibility.test.js
