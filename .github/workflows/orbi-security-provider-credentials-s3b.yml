name: ORBI Security MuAPI desktop transport S3B validation

on:
  push:
    branches:
      - security/provider-credential-desktop-s3b
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout S3B branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Desktop transport static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const preload = fs.readFileSync('electron/preload.js', 'utf8');
          const core = fs.readFileSync('electron/lib/muapiTransportCore.js', 'utf8');
          const client = fs.readFileSync('src/lib/muapi.js', 'utf8');

          if (/getSecret|getMuapiKey/.test(preload)) {
            throw new Error('Preload must not expose provider secret reads');
          }
          if (!core.includes("https://api.muapi.ai")) {
            throw new Error('MuAPI main-process transport must pin the provider origin');
          }
          if (!core.includes("startsWith('/api/v1/')")) {
            throw new Error('MuAPI main-process transport must enforce /api/v1 paths');
          }
          if (!client.includes('this.authenticatedFetch.bind(this)')) {
            throw new Error('Polling is not routed through authenticated desktop transport');
          }
          if (!client.includes('window.orbiMuapi.request')) {
            throw new Error('MuapiClient desktop transport is not connected');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Electron syntax gate
        run: find electron -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('S3B_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
