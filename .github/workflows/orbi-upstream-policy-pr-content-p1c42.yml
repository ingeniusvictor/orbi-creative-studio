name: ORBI P1C42 Policy PR Content Validator

on:
  pull_request:
    paths:
      - 'src/lib/upstreamPolicyPrContent.mjs'
      - 'tests/upstreamPolicyPrContent.test.js'
      - 'docs/PHASE-1C42-POLICY-PR-CONTENT-VALIDATOR.md'
      - '.github/workflows/orbi-upstream-policy-pr-content-p1c42.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/upstreamPolicyPrContent.test.js
