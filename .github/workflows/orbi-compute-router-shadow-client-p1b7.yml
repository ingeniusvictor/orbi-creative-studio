name: ORBI Compute Router shadow client P1B7 validation

on:
  push:
    branches:
      - feature/compute-router-shadow-client-p1b7
  pull_request:
    branches:
      - feature/muapi-passive-health-p1b6
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout shadow client branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Shadow client execution stop gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/computeRouter/shadowClient.mjs', 'utf8');
          const forbidden = [
            'localAI',
            'orbiMuapi',
            '.generate(',
            'fetch(',
            'ipcRenderer',
            'ipcMain',
            'ImageStudio',
            'VideoStudio',
          ];
          const hits = forbidden.filter((token) => source.includes(token));
          if (hits.length) throw new Error('Shadow client gained execution/Studio coupling: ' + hits.join(', '));
          if (!source.includes('getReadinessSnapshot')) throw new Error('Readiness bridge consumption missing');
          if (!source.includes('observeStudioRequest')) throw new Error('Fail-soft observer missing');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Shadow client tests
        run: node --test tests/computeRouterShadowClient.test.js tests/computeRouterShadowParity.test.js tests/computeRouterReadinessBridge.test.js tests/computeRouterProviderReadiness.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('SHADOW_CLIENT_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
