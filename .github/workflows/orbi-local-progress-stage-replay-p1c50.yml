name: ORBI P1C50 Local Progress Stage Replay

on:
  pull_request:
    paths:
      - 'electron/lib/localInferenceRuntime.js'
      - 'tests/localInferenceProgress.test.js'
      - 'docs/PHASE-1C50-LOCAL-PROGRESS-STAGE-REPLAY-FIX.md'
      - '.github/workflows/orbi-local-progress-stage-replay-p1c50.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/localInferenceProgress.test.js
