name: ORBI Build identity injection P1B19 validation

on:
  push:
    branches:
      - feature/build-identity-injection-p1b19
  pull_request:
    branches:
      - feature/cutover-review-bundle-p1b18
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build identity branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Generate and verify exact checkout identity
        run: |
          npm run build:identity
          node - <<'NODE'
          const { execFileSync } = require('child_process');
          const generated = require('./electron/generated/buildIdentity.js');
          const gitHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase();
          if (generated.sourceCommit !== gitHead) {
            throw new Error(`Generated build identity mismatch: ${generated.sourceCommit} !== ${gitHead}`);
          }
          if (!/^[0-9a-f]{40}$/.test(generated.sourceCommit)) {
            throw new Error('Generated build identity is not an exact SHA');
          }
          NODE

      - name: Build identity static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const writer = fs.readFileSync('scripts/write-build-identity.js', 'utf8');
          const runtime = fs.readFileSync('electron/lib/buildIdentity.js', 'utf8');
          const preload = fs.readFileSync('electron/preload.js', 'utf8');
          const pkg = require('./package.json');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          if (!writer.includes("execFileSync('git', ['rev-parse', 'HEAD']")) {
            throw new Error('Build identity does not resolve checked-out git HEAD');
          }
          if (!writer.includes('ORBI_BUILD_SHA does not match checked-out git HEAD')) {
            throw new Error('Explicit build SHA mismatch gate missing');
          }
          if (!runtime.includes('/^[0-9a-f]{40}$/i')) {
            throw new Error('Runtime exact SHA validation missing');
          }
          if (!preload.includes("contextBridge.exposeInMainWorld('orbiBuildIdentity', getBuildIdentity());")) {
            throw new Error('Read-only preload build identity exposure missing');
          }
          if (preload.includes("ipcRenderer.invoke('build-identity")) {
            throw new Error('Build identity must not use IPC');
          }
          if (pkg.scripts['vite:build'] !== 'npm run build:identity && vite build') {
            throw new Error('Vite build bypasses build identity generation');
          }
          if (image.includes('orbiBuildIdentity') || video.includes('orbiBuildIdentity')) {
            throw new Error('Build identity entered a generation component');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build identity tests
        run: node --test tests/buildIdentity.test.js tests/cutoverReviewBundle.test.js tests/parityBuildBinding.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer with identity
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('BUILD_IDENTITY_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE