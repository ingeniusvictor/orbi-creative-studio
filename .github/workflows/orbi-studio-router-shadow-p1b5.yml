name: ORBI Studio Router shadow parity P1B5 validation

on:
  push:
    branches:
      - feature/studio-router-shadow-parity-p1b5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout shadow parity branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Shadow-only static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const shadow = fs.readFileSync('src/lib/computeRouter/studioShadow.mjs', 'utf8');
          const imageStudio = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const videoStudio = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          const banned = [
            'fetch(',
            'window.',
            'ipcRenderer',
            'ipcMain',
            'localAI.generate',
            'muapi.generate',
            'orbiMuapi',
          ];
          const hits = banned.filter((token) => shadow.includes(token));
          if (hits.length) {
            throw new Error('Shadow planner contains execution coupling: ' + hits.join(', '));
          }

          if (imageStudio.includes('studioShadow') || videoStudio.includes('studioShadow')) {
            throw new Error('P1B.5 must not be wired into Studio execution yet');
          }

          if (!shadow.includes("mode: 'shadow-only'")) {
            throw new Error('Shadow-only report marker missing');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Shadow parity tests
        run: node --test tests/computeRouterContracts.test.js tests/computeRouterProviderAdapters.test.js tests/computeRouterProviderReadiness.test.js tests/providerReadinessSnapshot.test.js tests/studioRouterShadow.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('STUDIO_SHADOW_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
