name: ORBI ECC AgentShield report-only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ecc-agentshield-report.yml"
      - ".orbi/**"
      - "docs/ecc/**"
      - ".claude/**"
      - ".mcp.json"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: read

concurrency:
  group: ecc-agentshield-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-only:
    name: agentshield-report-only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: AgentShield security scan
        id: agentshield
        continue-on-error: true
        uses: affaan-m/agentshield@b0891303bdcd6037376a94263d45cfd2ff3dfb98 # ecc-agentshield v1.6.0 release
        with:
          path: "."
          min-severity: "low"
          fail-on-findings: false
          format: "sarif"
          sarif-output: "agentshield-results.sarif"
          supply-chain: true
          supply-chain-online: false
          fail-on-supply-chain: false
          evidence-pack: ".agentshield/evidence"
          verify-evidence-pack: true

      - name: Write report summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ORBI ECC AgentShield — report only"
            echo
            echo "- Pinned AgentShield commit: `b0891303bdcd6037376a94263d45cfd2ff3dfb98`"
            echo "- Scanner step outcome: `${{ steps.agentshield.outcome }}`"
            echo "- Security score: `${{ steps.agentshield.outputs.score }}`"
            echo "- Grade: `${{ steps.agentshield.outputs.grade }}`"
            echo "- Total findings: `${{ steps.agentshield.outputs.total-findings }}`"
            echo "- Critical findings: `${{ steps.agentshield.outputs.critical-count }}`"
            echo "- Supply-chain status: `${{ steps.agentshield.outputs.supply-chain-status }}`"
            echo
            echo "**This workflow is non-blocking and does not apply fixes.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AgentShield evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecc-agentshield-report-${{ github.run_id }}
          path: |
            agentshield-results.sarif
            .agentshield/evidence
          if-no-files-found: warn
          retention-days: 14
