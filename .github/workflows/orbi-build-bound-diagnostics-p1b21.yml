name: ORBI Build-bound diagnostics P1B21 validation

on:
  push:
    branches:
      - feature/build-bound-diagnostics-p1b21
  pull_request:
    branches:
      - feature/session-build-binding-p1b20
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build-bound diagnostics branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build-bound diagnostics static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const panel = fs.readFileSync('src/components/RouterDiagnosticsPanel.js', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');
          const main = fs.readFileSync('src/main.js', 'utf8');

          const required = [
            'getRendererBuildIdentity',
            'bindCurrentStudioParitySessionToBuild',
            'buildIdentity.sourceCommit',
            'buildIdentity.appVersion',
            "legacy-dispatcher-only",
            'diagnostic-preview:',
          ];
          for (const token of required) {
            if (!panel.includes(token)) {
              throw new Error('Build-bound diagnostics invariant missing: ' + token);
            }
          }

          const actions = (panel.match(/\.onclick\s*=/g) || []).length;
          if (actions !== 1 || !panel.includes('refresh.onclick = render')) {
            throw new Error('Build-bound diagnostics must keep Refresh as the only action');
          }

          const forbidden = [
            'localStorage',
            'sessionStorage',
            'indexedDB',
            'fetch(',
            'ipcRenderer',
            'ipcMain',
            'clearStudioParitySessionEvidence',
            'routeGenerationRequest',
            'localAI.generate',
            'muapi.generate',
          ];
          const hits = forbidden.filter((token) => panel.includes(token));
          if (hits.length) {
            throw new Error('Build-bound diagnostics side effect coupling: ' + hits.join(', '));
          }

          if (image.includes('buildIdentityClient') || video.includes('buildIdentityClient')) {
            throw new Error('Build-bound diagnostics entered a generation component');
          }
          if (main.includes('bindCurrentStudioParitySessionToBuild')) {
            throw new Error('Build-bound session binding must not auto-run at bootstrap');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build-bound diagnostics tests
        run: node --test tests/buildBoundDiagnostics.test.js tests/routerDiagnosticsPanel.test.js tests/sessionBuildBinding.test.js tests/buildIdentity.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer with identity
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('BUILD_BOUND_DIAGNOSTICS_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE