name: ORBI Evidence integrity report P1B25 validation

on:
  push:
    branches:
      - feature/evidence-integrity-report-p1b25-canonical
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout evidence integrity report branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Evidence integrity report static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/computeRouter/evidenceIntegrityReport.mjs', 'utf8');
          const diagnostics = fs.readFileSync('src/components/RouterDiagnosticsPanel.js', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          const required = [
            "EVIDENCE_INTEGRITY_REPORT_AUTHORITY = 'legacy-dispatcher-only'",
            'authenticityVerified: false',
            'cutoverAuthorized: false',
            'validateCertificationReleaseEvidenceExport',
            'validateFingerprintShape',
            'verifyEvidenceFingerprint',
            'INTEGRITY_VERIFIED',
            'FINGERPRINT_MISMATCH',
            'EXPORT_INVALID',
            'FINGERPRINT_INVALID',
            'CRYPTO_UNAVAILABLE',
          ];
          for (const token of required) {
            if (!source.includes(token)) {
              throw new Error('Evidence integrity report invariant missing: ' + token);
            }
          }

          const forbidden = [
            "from 'node:fs'",
            "require('fs')",
            "require('node:fs')",
            "from 'node:crypto'",
            "require('node:crypto')",
            'writeFile',
            'download',
            'Blob(',
            'fetch(',
            'ipcRenderer',
            'ipcMain',
            'localStorage',
            'sessionStorage',
            'routeGenerationRequest(',
            'localAI.generate',
            'muapi.generate',
          ];
          const hits = forbidden.filter((token) => source.includes(token));
          if (hits.length) {
            throw new Error('Evidence integrity report side effect coupling: ' + hits.join(', '));
          }

          if (diagnostics.includes('evidenceIntegrityReport')) {
            throw new Error('P1B.25 must not add integrity report actions to diagnostics UI');
          }
          if (image.includes('evidenceIntegrityReport') || video.includes('evidenceIntegrityReport')) {
            throw new Error('Evidence integrity report entered a generation component');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Evidence integrity report tests
        run: node --test tests/evidenceIntegrityReport.test.js tests/evidenceFingerprint.test.js tests/evidenceExportValidator.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer with identity
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('EVIDENCE_INTEGRITY_REPORT_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE