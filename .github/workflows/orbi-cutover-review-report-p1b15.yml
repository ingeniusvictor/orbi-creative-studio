name: ORBI Cutover review report P1B15 validation

on:
  push:
    branches:
      - feature/cutover-review-report-p1b15
  pull_request:
    branches:
      - feature/cutover-eligibility-contract-p1b14
      - integration/orbi-foundation
    paths:
      - '.github/workflows/orbi-cutover-review-report-p1b15.yml'
      - 'docs/PHASE-1B15-CUTOVER-REVIEW-REPORT.md'
      - 'src/lib/computeRouter/cutoverReviewReport.mjs'
      - 'tests/cutoverReviewReport.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout cutover review report branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cutover review static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/computeRouter/cutoverReviewReport.mjs', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          const forbidden = [
            'fetch(',
            'ipcRenderer',
            'ipcMain',
            'localAI.generate',
            'muapi.generate',
            'routeGenerationRequest(',
            'window.',
            'globalThis.',
            'localStorage',
            'sessionStorage',
          ];
          const hits = forbidden.filter((token) => source.includes(token));
          if (hits.length) {
            throw new Error('Cutover review report contains execution/storage coupling: ' + hits.join(', '));
          }

          const required = [
            'ORBI Compute Router — Cutover Review Report',
            "'READY_FOR_REVIEW'",
            "'BLOCKED'",
            "executionAuthority: 'legacy-dispatcher-only'",
            'cutoverAuthorized: false',
            "route.cutoverAuthorized !== false",
          ];
          for (const token of required) {
            if (!source.includes(token)) {
              throw new Error('Cutover review invariant missing: ' + token);
            }
          }

          if (image.includes('cutoverReviewReport') || video.includes('cutoverReviewReport')) {
            throw new Error('Cutover review report must not be imported into Studio execution');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Cutover review tests
        run: node --test tests/cutoverReviewReport.test.js tests/cutoverEligibility.test.js tests/studioParityTargets.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('CUTOVER_REVIEW_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE