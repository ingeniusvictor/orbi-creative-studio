name: ORBI Security provider credential Stage S2 migration

on:
  push:
    branches:
      - security/provider-credential-access-s2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout S2 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply deterministic StandaloneShell migration
        run: node scripts/provider-credential-s2-migrate.cjs

      - name: Credential boundary static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['src', 'components', 'app'];
          const allowed = path.normalize('src/lib/providerCredentials.mjs');
          const violations = [];
          const patterns = [
            /localStorage\.(?:getItem|setItem|removeItem)\(\s*['"]muapi_key['"]/, 
            /window\.__MUAPI_KEY__/,
            /const\s+STORAGE_KEY\s*=\s*['"]muapi_key['"]/, 
            /document\.cookie\s*=.*muapi_key/,
            /document\.cookie\.match\(\/muapi_key/,
          ];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (/\.(?:js|mjs|jsx)$/.test(entry.name) && path.normalize(p) !== allowed) {
                const text = fs.readFileSync(p, 'utf8');
                if (patterns.some((rx) => rx.test(text))) violations.push(p);
              }
            }
          }
          roots.forEach(walk);
          console.log('S2_CREDENTIAL_BOUNDARY_VIOLATIONS', JSON.stringify(violations));
          if (violations.length) throw new Error('Direct browser MuAPI credential access remains outside providerCredentials');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Electron syntax gate
        run: find electron -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('PROVIDER_CREDENTIAL_S2_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE

      - name: Commit validated StandaloneShell migration
        run: |
          if git diff --quiet -- components/StandaloneShell.js; then
            echo "No StandaloneShell migration diff to commit."
            exit 0
          fi
          git config user.name "ingeniusvictor"
          git config user.email "ingenius.victor@gmail.com"
          git add components/StandaloneShell.js
          git commit -m "security: complete browser credential boundary Stage S2"
          git push origin HEAD:security/provider-credential-access-s2
