name: ORBI P1C32 Upstream Security Drift

on:
  pull_request:
    paths:
      - 'src/components/ImageStudio.js'
      - 'src/components/VideoStudio.js'
      - 'src/components/CinemaStudio.js'
      - 'src/components/LipSyncStudio.js'
      - 'src/lib/upstreamDriftPolicy.mjs'
      - 'tests/historyDomSafety.test.js'
      - 'tests/upstreamDriftPolicy.test.js'
      - 'docs/PHASE-1C32-UPSTREAM-SECURITY-DRIFT-INTAKE.md'
      - '.github/workflows/orbi-upstream-security-drift-p1c32.yml'
  workflow_dispatch:

jobs:
  p1c32:
    name: P1C32 security and upstream policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run P1C32 regression gate
        run: node --test tests/historyDomSafety.test.js tests/upstreamDriftPolicy.test.js
