name: ORBI Phase 0 sd.cpp Windows binary certification

on:
  push:
    branches:
      - cert/phase-0-sdcpp-windows
    paths:
      - .github/workflows/orbi-phase-0-sdcpp-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve binary exactly with upstream selector
        shell: pwsh
        run: |
          @'
          const fs=require('fs');
          const {pickBinaryAssetForPlatform}=require('./electron/lib/localInferenceAssets');
          (async()=>{
            const res=await fetch('https://api.github.com/repos/leejet/stable-diffusion.cpp/releases?per_page=15',{
              headers:{'User-Agent':'orbi-phase0-win-cert'}
            });
            if(!res.ok) throw new Error(`GitHub API HTTP ${res.status}`);
            const releases=await res.json();
            for(const release of releases){
              const zips=(release.assets||[]).filter(a=>a.name.endsWith('.zip'));
              const picked=pickBinaryAssetForPlatform({
                platform:'win32',arch:'x64',zipNames:zips.map(a=>a.name)
              });
              if(picked){
                const asset=zips.find(a=>a.name===picked);
                const out={
                  releaseTag:release.tag_name,
                  releaseId:release.id,
                  assetName:asset.name,
                  assetId:asset.id,
                  assetSize:asset.size,
                  url:asset.browser_download_url
                };
                fs.writeFileSync(process.env.RUNNER_TEMP+'\\sdcpp-choice.json',JSON.stringify(out,null,2));
                console.log(JSON.stringify(out,null,2));
                return;
              }
            }
            throw new Error('No Windows x64 sd.cpp asset found');
          })();
          '@ | node

      - name: Download and execute selected Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $choice = Get-Content (Join-Path $env:RUNNER_TEMP "sdcpp-choice.json") | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP $choice.assetName
          Invoke-WebRequest -Uri $choice.url -OutFile $zip
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "ARCHIVE_SHA256=$zipHash"

          $dest=Join-Path $env:RUNNER_TEMP "sdcpp"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $cli=Get-ChildItem $dest -Recurse -Filter "sd-cli.exe" | Select-Object -First 1
          if(-not $cli){ throw "sd-cli.exe not found" }
          $cliHash=(Get-FileHash $cli.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "SDCLI_PATH=$($cli.FullName)"
          Write-Host "SDCLI_BYTES=$($cli.Length)"
          Write-Host "SDCLI_SHA256=$cliHash"

          $output=& $cli.FullName --help 2>&1
          $output | Select-Object -First 80
          if(-not (($output -join "\n") -match "Usage|stable-diffusion|options")){
            throw "sd-cli help output was not recognized"
          }
          Write-Host "SDCPP_WINDOWS_BINARY_EXECUTION_PASS"
