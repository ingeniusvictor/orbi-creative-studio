name: ORBI Security Batch B1a PostCSS override experiment

on:
  push:
    branches:
      - security/batch-b1a-postcss-override
    paths:
      - .github/workflows/orbi-security-batch-b1a.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Batch A base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify starting point
        env:
          BATCH_A_COMMIT: 7d852659d053995dbf9ca36b236854aac99406ab
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BATCH_A_COMMIT" HEAD
          changed="$(git diff --name-only "$BATCH_A_COMMIT"..HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = ".github/workflows/orbi-security-batch-b1a.yml"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Add targeted Next PostCSS override
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          pkg.overrides ||= {};
          pkg.overrides.next ||= {};
          pkg.overrides.next.postcss = '8.5.28';
          fs.writeFileSync(path, JSON.stringify(pkg,null,2)+'\n');
          NODE
          git diff -- package.json

      - name: Resolve lockfile with override
        run: npm install --package-lock-only

      - name: Verify resolved PostCSS versions
        run: |
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const root=lock.packages?.['node_modules/postcss']?.version;
          const nested=lock.packages?.['node_modules/next/node_modules/postcss']?.version || null;
          console.log(JSON.stringify({rootPostcss:root,nextNestedPostcss:nested},null,2));
          if (nested && nested !== '8.5.28') {
            throw new Error('Next nested PostCSS was not overridden to 8.5.28');
          }
          NODE

      - name: Install overridden graph
        run: npm ci

      - name: Run baseline tests
        run: node --test tests/*.test.js

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production audit gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit.json
          set -e
          node - <<'NODE'
          const a=require('/tmp/audit.json');
          const v=a.metadata?.vulnerabilities || {};
          console.log('B1A_AUDIT', JSON.stringify(v));
          const rows=Object.entries(a.vulnerabilities||{}).map(([name,x])=>({
            name,severity:x.severity,direct:x.isDirect,fixAvailable:x.fixAvailable
          }));
          console.log(JSON.stringify(rows,null,2));
          if ((v.critical||0) > 0 || (v.high||0) > 0) {
            throw new Error('Batch B1a did not eliminate critical/high production findings');
          }
          NODE

      - name: Docker runtime smoke
        run: |
          set -euo pipefail
          docker build -t orbi-creative-studio:b1a .
          docker run -d --name orbi-b1a -p 3000:3000 orbi-creative-studio:b1a
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/home.html; then
              echo "B1A_DOCKER_HTTP_PASS"
              docker rm -f orbi-b1a
              exit 0
            fi
            sleep 2
          done
          docker logs orbi-b1a || true
          docker rm -f orbi-b1a || true
          exit 1

      - name: Commit successful experiment
        run: |
          set -euo pipefail
          git config user.name "orbi-security-bot"
          git config user.email "orbi-security-bot@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: override Next PostCSS to patched 8.5.28"
          git push origin HEAD:security/batch-b1a-postcss-override
