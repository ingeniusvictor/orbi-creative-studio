name: ORBI Certified profile registry P1C9 validation

on:
  push:
    branches:
      - feature/certified-profile-registry-p1c9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1C9
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: P1C9 static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const registry = fs.readFileSync('src/lib/computeRouter/certifiedResourceProfileRegistry.mjs', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');
          const readiness = fs.readFileSync('src/lib/computeRouter/providerReadiness.mjs', 'utf8');

          for (const token of [
            'fetch(',
            'ipcMain',
            'ipcRenderer',
            'localStorage',
            'sessionStorage',
            'writeFile',
            'routeGenerationRequest(',
          ]) {
            if (registry.includes(token)) throw new Error('P1C9 registry has forbidden side effect: ' + token);
          }

          for (const token of [
            'validateCertifiedResourceProfile',
            'evaluateCertifiedLocalCompatibility',
            "mode: 'immutable-shadow-registry'",
            "mode: 'shadow-diagnostic-only'",
            'snapshotValidatedEntry',
            'routingEligible: false',
            'cutoverAuthorized: false',
            "executionAuthority: 'legacy-dispatcher-only'",
            'REGISTRY_DUPLICATE_PROFILE_CONTEXT',
          ]) {
            if (!registry.includes(token)) throw new Error('P1C9 invariant missing: ' + token);
          }

          if (image.includes('certifiedResourceProfileRegistry') || video.includes('certifiedResourceProfileRegistry')) {
            throw new Error('P1C9 must not be imported into Studio execution');
          }
          if (readiness.includes('certifiedResourceProfileRegistry')) {
            throw new Error('P1C9 must not automatically alter provider readiness');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: P1C9 focused tests
        run: node --test tests/certifiedResourceProfileRegistry.test.js tests/resourceProfileCertification.test.js tests/localCompatibility.test.js tests/modelResourceProfiles.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1C9_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
