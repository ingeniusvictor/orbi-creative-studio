name: Import pinned upstream baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-upstream-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-upstream-baseline
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORBI repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "orbi-baseline-bot"
          git config user.email "orbi-baseline-bot@users.noreply.github.com"

      - name: Fetch pinned upstream history
        env:
          UPSTREAM_URL: https://github.com/Anil-matcha/Open-Generative-AI.git
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main --tags --force
          git cat-file -e "$PINNED_COMMIT^{commit}"

      - name: Verify immutable baseline
        env:
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
          PINNED_TREE: 3b4c89a044621ea677d9ceb477f301301a704cdf
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse "$PINNED_COMMIT")"
          actual_tree="$(git rev-parse "$PINNED_COMMIT^{tree}")"

          echo "Pinned commit: $actual_commit"
          echo "Pinned tree:   $actual_tree"

          test "$actual_commit" = "$PINNED_COMMIT"
          test "$actual_tree" = "$PINNED_TREE"

      - name: Publish immutable upstream-baseline branch
        env:
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin upstream-baseline >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --heads origin upstream-baseline | awk '{print $1}')"
            if [ "$remote_sha" != "$PINNED_COMMIT" ]; then
              echo "::error::upstream-baseline already exists at $remote_sha; refusing to move immutable baseline."
              exit 1
            fi
            echo "upstream-baseline already points to the certified commit."
            exit 0
          fi

          git branch upstream-baseline "$PINNED_COMMIT"
          git push origin upstream-baseline

      - name: Summary
        run: |
          {
            echo "## ORBI Creative Studio baseline import"
            echo
            echo "- Branch: `upstream-baseline`"
            echo "- Commit: `871c1d4ef4e184d7b6b5117147d863d30b656cbb`"
            echo "- Tree: `3b4c89a044621ea677d9ceb477f301301a704cdf`"
            echo "- Source: `Anil-matcha/Open-Generative-AI`"
            echo
            echo "The workflow does not execute upstream application code."
          } >> "$GITHUB_STEP_SUMMARY"
