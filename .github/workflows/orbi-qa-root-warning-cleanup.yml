name: ORBI QA root warning cleanup

on:
  push:
    branches:
      - qa/lint-root-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Electron syntax gate
        run: find electron -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Lint with reduced ceiling
        run: npm run lint -- --max-warnings 10
      - name: Root tests
        run: node --test tests/*.test.js
      - name: Build workspaces
        run: npm run build:packages
      - name: Build Next
        run: npm run build
      - name: Build Electron renderer
        run: npm run vite:build
