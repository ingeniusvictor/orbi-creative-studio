name: ORBI Router diagnostics panel P1B13 validation

on:
  push:
    branches:
      - feature/router-diagnostics-panel-p1b13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Router diagnostics panel branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Read-only diagnostics static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const panel = fs.readFileSync('src/components/RouterDiagnosticsPanel.js', 'utf8');
          const settings = fs.readFileSync('src/components/SettingsModal.js', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          const forbidden = [
            'localAI',
            'muapi.',
            'fetch(',
            'ipcRenderer',
            'ipcMain',
            'localStorage',
            'sessionStorage',
            'setMuapiCredential',
            'clearStudioParitySessionEvidence',
            'routeGenerationRequest',
            'enableFallback',
          ];
          const hits = forbidden.filter((token) => panel.includes(token));
          if (hits.length) {
            throw new Error('Diagnostics panel contains execution/mutation coupling: ' + hits.join(', '));
          }

          if (!panel.includes("panel.dataset.orbiRouterDiagnostics = 'read-only'")) {
            throw new Error('Read-only diagnostics marker missing');
          }
          const panelActions = (panel.match(/\.onclick\s*=/g) || []).length;
          if (panelActions !== 1 || !panel.includes('refresh.onclick = render')) {
            throw new Error('Diagnostics panel must expose Refresh as its only action');
          }
          if ((settings.match(/id: 'diagnostics'/g) || []).length !== 1) {
            throw new Error('Expected exactly one diagnostics Settings tab');
          }
          if (!settings.includes("const diagnosticsPanel = isLocalAIAvailable() ? RouterDiagnosticsPanel() : null;")) {
            throw new Error('Diagnostics tab is not Electron-gated');
          }
          if (image.includes('RouterDiagnosticsPanel') || video.includes('RouterDiagnosticsPanel')) {
            throw new Error('Diagnostics panel entered a generation component');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Router diagnostics panel tests
        run: node --test tests/routerDiagnosticsPanel.test.js tests/studioParityTargets.test.js tests/routerParityDiagnostics.test.js tests/routerParitySession.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('ROUTER_DIAGNOSTICS_PANEL_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE