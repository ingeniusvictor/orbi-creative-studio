name: ORBI Real evidence provenance gate P1C31 validation

on:
  push:
    branches:
      - feature/real-evidence-provenance-gate-p1c31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1C31
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: P1C31 static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const provenance = fs.readFileSync(
            'src/lib/computeRouter/runtimeCertificationEvidenceProvenance.mjs',
            'utf8',
          );
          const session = fs.readFileSync(
            'src/lib/computeRouter/userBenchmarkSession.mjs',
            'utf8',
          );
          const sampleCore = fs.readFileSync(
            'electron/lib/controlledBenchmarkSampleCore.js',
            'utf8',
          );
          const executor = fs.readFileSync(
            'src/lib/computeRouter/runtimeCertificationSourceApplyExecutor.mjs',
            'utf8',
          );
          const runtimeSource = fs.readFileSync(
            'src/lib/computeRouter/runtimeResourceProfileCertifications.mjs',
            'utf8',
          );
          const settings = fs.readFileSync('src/components/SettingsModal.js', 'utf8');
          const panel = fs.readFileSync('src/components/RouterDiagnosticsPanel.js', 'utf8');
          const main = fs.readFileSync('src/main.js', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          for (const token of [
            "'p1c31-real-benchmark-acquisition-proof'",
            "'electron-main-controlled-benchmark'",
            "'real-runtime-measurement'",
            'trustedMainProcess: true',
            'runtimeIntegrityVerified: true',
            'runtimeManifestPinned: true',
            'benchmarkProcessExecuted: true',
            'fixture: false',
            'synthetic: false',
            'demo: false',
            'cryptographicAuthenticityVerified: false',
          ]) {
            if (!sampleCore.includes(token)) {
              throw new Error('P1C31 acquisition proof invariant missing: ' + token);
            }
          }

          for (const token of [
            'readUserBenchmarkSessionProvenance',
            "'p1c31-real-evidence-provenance-attestation'",
            "'real-evidence-provenance-verified'",
            'validatePromotionPackage',
            'validateRuntimeCertificationSourceApplyDryRun',
            'promotionPackageValidated: true',
            'certificationEntryBound: true',
            'sourceApplyPlanValidated: true',
            'sourceApplyPlanBound: true',
            'realEvidenceProvenanceVerified: provenanceVerified',
            'cryptographicAuthenticityVerified: false',
            'sourceMutationApplied: false',
            'runtimeRegistryLoaded: false',
            'routingEligible: false',
            'cutoverAuthorized: false',
            "executionAuthority: 'legacy-dispatcher-only'",
          ]) {
            if (!provenance.includes(token)) {
              throw new Error('P1C31 provenance invariant missing: ' + token);
            }
          }

          if (!session.includes('const provenanceRecords = new Map();')
              || !session.includes('readUserBenchmarkSessionProvenance')
              || !session.includes('validateBridgeProvenance')) {
            throw new Error('P1C21 must retain P1C31 provenance separately');
          }

          if (!executor.includes('readRuntimeCertificationEvidenceProvenanceAttestation')
              || !executor.includes('SOURCE_APPLY_REAL_EVIDENCE_PROVENANCE_MISSING')
              || !executor.includes('SOURCE_APPLY_REAL_EVIDENCE_PROVENANCE_INVALID')
              || !executor.includes('realEvidenceProvenanceVerified: true')) {
            throw new Error('P1C30 must require P1C31 provenance before external apply');
          }

          for (const forbidden of [
            "from 'node:fs'",
            "from 'fs'",
            'writeFile',
            'createWriteStream',
            'fetch(',
            'octokit',
            'updateFile',
            'createCommit',
            'updateRef',
            'ipcRenderer',
            'ipcMain',
            'localStorage',
            'sessionStorage',
            'indexedDB',
            'loadRuntimeCertifiedResourceProfileRegistry',
            'routingEligible: true',
            'cutoverAuthorized: true',
            "executionAuthority: 'compute-router'",
            'cryptographicAuthenticityVerified: true',
          ]) {
            if (provenance.includes(forbidden)) {
              throw new Error('P1C31 provenance gate gained forbidden capability: ' + forbidden);
            }
          }

          if (!runtimeSource.includes('const certifications = [];')
              || !runtimeSource.includes('sourceRevision: 1')) {
            throw new Error('P1C31 must leave real runtime certification source unchanged');
          }

          for (const source of [settings, panel, main, image, video]) {
            if (source.includes('runtimeCertificationEvidenceProvenance')
                || source.includes('verifyRuntimeCertificationEvidenceProvenance')) {
              throw new Error('P1C31 entered UI/startup/generation surface');
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: P1C31 focused tests
        run: node --test tests/controlledBenchmarkSampleCore.test.js tests/userBenchmarkSession.test.js tests/runtimeCertificationEvidenceProvenance.test.js tests/runtimeCertificationSourceApplyExecutor.test.js tests/runtimeCertificationSourceApplyDryRun.test.js tests/runtimeCertificationPromotion.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1C31_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
