name: ORBI Security Batch A lock-safe remediation

on:
  push:
    branches:
      - security/batch-a-lock-safe
    paths:
      - .github/workflows/orbi-security-batch-a.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify baseline ancestry and workflow-only starting divergence
        env:
          PINNED_COMMIT: 871c1d4ef4e184d7b6b5117147d863d30b656cbb
          PINNED_TREE: 3b4c89a044621ea677d9ceb477f301301a704cdf
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PINNED_COMMIT^{tree}")" = "$PINNED_TREE"
          git merge-base --is-ancestor "$PINNED_COMMIT" HEAD
          changed="$(git diff --name-only "$PINNED_COMMIT"..HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = ".github/workflows/orbi-security-batch-a.yml"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install exact baseline dependencies
        run: npm ci

      - name: Capture baseline production audit
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit-before.json
          set -e
          node -e "const a=require('/tmp/audit-before.json'); console.log('BEFORE', a.metadata.vulnerabilities)"

      - name: Apply lockfile-only npm audit fixes
        run: |
          set +e
          npm audit fix --package-lock-only
          status=$?
          set -e
          echo "npm audit fix exit code: $status"
          git diff -- package.json package-lock.json

      - name: Enforce package.json immutability
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package.json; then
            echo "::error::package.json changed; Batch A is lock-safe only."
            git diff -- package.json
            exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "::warning::No package-lock changes produced."
          fi

      - name: Install remediated lockfile
        run: npm ci

      - name: Test remediated graph
        run: node --test tests/*.test.js

      - name: Build remediated workspaces
        run: npm run build:packages

      - name: Build remediated Next.js app
        run: npm run build

      - name: Build remediated Electron renderer
        run: npm run vite:build

      - name: Audit production dependencies after remediation
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit-after.json
          set -e
          node - <<'NODE'
          const b=require('/tmp/audit-before.json');
          const a=require('/tmp/audit-after.json');
          console.log(JSON.stringify({
            before:b.metadata?.vulnerabilities,
            after:a.metadata?.vulnerabilities
          },null,2));
          const rows=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({
            name,severity:v.severity,direct:v.isDirect,fixAvailable:v.fixAvailable
          }));
          console.log("AFTER_ROWS");
          console.log(JSON.stringify(rows,null,2));
          NODE

      - name: Commit lockfile remediation if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git config user.name "orbi-security-bot"
          git config user.email "orbi-security-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: apply lock-safe dependency remediation"
          git push origin HEAD:security/batch-a-lock-safe
