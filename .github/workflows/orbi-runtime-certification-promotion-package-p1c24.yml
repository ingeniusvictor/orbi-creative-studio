name: ORBI Runtime certification promotion package P1C24 validation

on:
  push:
    branches:
      - feature/runtime-certification-promotion-package-p1c24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1C24
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: P1C24 static safety gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const promotion = fs.readFileSync('src/lib/computeRouter/runtimeCertificationPromotion.mjs', 'utf8');
          const panel = fs.readFileSync('src/components/RouterDiagnosticsPanel.js', 'utf8');
          const settings = fs.readFileSync('src/components/SettingsModal.js', 'utf8');
          const runtimeSource = fs.readFileSync('src/lib/computeRouter/runtimeResourceProfileCertifications.mjs', 'utf8');
          const main = fs.readFileSync('src/main.js', 'utf8');
          const image = fs.readFileSync('src/components/ImageStudio.js', 'utf8');
          const video = fs.readFileSync('src/components/VideoStudio.js', 'utf8');

          for (const token of [
            'validateCertificationEntry',
            'createCertifiedResourceProfileRegistry',
            'promotionOnly: true',
            'sourceReviewRequired: true',
            'sourceMutationApplied: false',
            'runtimeRegistryLoaded: false',
            'authenticityVerified: false',
            'routingEligible: false',
            'cutoverAuthorized: false',
            "executionAuthority: 'legacy-dispatcher-only'",
          ]) {
            if (!promotion.includes(token)) {
              throw new Error('P1C24 promotion invariant missing: ' + token);
            }
          }

          for (const forbidden of [
            "from 'node:fs'",
            "from 'fs'",
            'fetch(',
            'ipcRenderer',
            'ipcMain',
            'localStorage',
            'sessionStorage',
            'indexedDB',
            'runtimeResourceProfileCertifications',
            'RUNTIME_RESOURCE_PROFILE_CERTIFICATION_SOURCE',
            'loadRuntimeCertifiedResourceProfileRegistry',
            'sourceMutationApplied: true',
            'runtimeRegistryLoaded: true',
            'authenticityVerified: true',
            'routingEligible: true',
            'cutoverAuthorized: true',
          ]) {
            if (promotion.includes(forbidden)) {
              throw new Error('P1C24 gained forbidden capability: ' + forbidden);
            }
          }

          for (const token of [
            "section.dataset.orbiRuntimeCertificationPromotion = 'promotion-only'",
            "button.dataset.orbiRuntimeCertificationPromotionPrepare = 'promotion-only'",
            'runtimeCertificationPromotionPrepare = null',
            'runtimeCertificationPromotionSummaryProvider = null',
            'result.sourceReviewRequired === true',
            'result.sourceMutationApplied === false',
            'result.runtimeRegistryLoaded === false',
          ]) {
            if (!panel.includes(token)) throw new Error('P1C24 UI invariant missing: ' + token);
          }

          if ((panel.match(/\.onclick\s*=/g) || []).length !== 6) {
            throw new Error('P1C24 Router Diagnostics must expose exactly six explicit click actions');
          }
          if ((panel.match(/\.onchange\s*=/g) || []).length !== 1) {
            throw new Error('P1C24 must preserve the single target onchange');
          }
          if ((panel.match(/\.oninput\s*=/g) || []).length !== 1) {
            throw new Error('P1C24 must preserve the single safety-margin oninput handler');
          }

          for (const forbidden of [
            'readRuntimeCertificationPromotionPackage',
            'summary.certificationEntry',
            'summary.certificationRecord',
            'summary.certifiedProfile',
            'summary.reviewNote',
            'summary.reviewerId',
            'summary.sourceCommit',
            'runtimeBinarySha256',
            'modelArtifactSha256',
            'auxiliaryArtifacts',
            'result.reason',
          ]) {
            if (panel.includes(forbidden)) {
              throw new Error('P1C24 UI exposes forbidden promotion payload: ' + forbidden);
            }
          }

          if (!settings.includes('runtimeCertificationPromotionPrepare: prepareRuntimeCertificationPromotion')
              || !settings.includes('runtimeCertificationPromotionSummaryProvider: getRuntimeCertificationPromotionSummary')) {
            throw new Error('P1C24 Settings wiring missing');
          }
          if (settings.includes('readRuntimeCertificationPromotionPackage')
              || settings.includes('runtimeResourceProfileCertifications')
              || settings.includes('RUNTIME_RESOURCE_PROFILE_CERTIFICATION_SOURCE')) {
            throw new Error('P1C24 Settings gained raw promotion/source access');
          }

          if (!runtimeSource.includes('const certifications = [];')
              || !runtimeSource.includes('sourceRevision: 1')) {
            throw new Error('P1C24 must leave runtime certification source unchanged');
          }

          for (const source of [main, image, video]) {
            if (source.includes('runtimeCertificationPromotion')
                || source.includes('prepareRuntimeCertificationPromotion')
                || source.includes('runtimeCertificationPromotionPrepare')) {
              throw new Error('P1C24 entered startup/generation execution');
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: P1C24 focused tests
        run: node --test tests/runtimeCertificationPromotion.test.js tests/runtimeCertificationPromotionUi.test.js tests/userBenchmarkCertification.test.js tests/runtimeCertifiedResourceProfileRegistry.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('P1C24_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
