name: ORBI Compute Router shadow parity P1B5 validation

on:
  push:
    branches:
      - feature/compute-router-shadow-parity-p1b5
  pull_request:
    branches:
      - feature/electron-readiness-snapshot-bridge
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout shadow parity branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Shadow-only static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/computeRouter/studioShadowRouting.mjs', 'utf8');
          const forbidden = [
            'window.',
            'ipcRenderer',
            'ipcMain',
            'fetch(',
            '.generate(',
            'orbiMuapi',
            'localAI',
            'wan2gp:generate',
            'local-ai:generate',
          ];
          const hits = forbidden.filter((token) => source.includes(token));
          if (hits.length) throw new Error('Shadow router gained execution coupling: ' + hits.join(', '));
          if (!source.includes("mode: 'shadow-only'")) throw new Error('Shadow-only marker missing');
          if (!source.includes('executed: false')) throw new Error('Execution stop marker missing');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Shadow parity tests
        run: node --test tests/computeRouterProviderReadiness.test.js tests/computeRouterShadowParity.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('SHADOW_PARITY_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
