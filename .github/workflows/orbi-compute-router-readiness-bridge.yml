name: ORBI Electron readiness snapshot bridge validation

on:
  push:
    branches:
      - feature/electron-readiness-snapshot-bridge
  pull_request:
    branches:
      - feature/compute-router-readiness-p1b3-clean
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout readiness bridge branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Read-only bridge static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const bridge = fs.readFileSync('electron/lib/computeRouterReadinessBridge.js', 'utf8');
          const preload = fs.readFileSync('electron/preload.js', 'utf8');
          const forbidden = [
            'local-ai:generate',
            'wan2gp:generate',
            'muapi-transport:request',
            'getSecret(',
            'decryptString',
          ];
          const hits = forbidden.filter((token) => bridge.includes(token));
          if (hits.length) throw new Error('Readiness bridge gained execution/secret coupling: ' + hits.join(', '));
          if (!bridge.includes('assertTrustedSender')) throw new Error('Trusted IPC sender gate missing');
          if (!preload.includes("exposeInMainWorld('orbiComputeRouter'")) throw new Error('Preload readiness surface missing');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Readiness bridge tests
        run: node --test tests/computeRouterProviderReadiness.test.js tests/computeRouterReadinessBridge.test.js

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('READINESS_BRIDGE_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
