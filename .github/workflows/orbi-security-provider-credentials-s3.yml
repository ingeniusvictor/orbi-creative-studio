name: ORBI Security desktop provider credentials S3 validation

on:
  push:
    branches:
      - security/provider-credential-desktop-s3
  pull_request:
    branches:
      - integration/orbi-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout S3 branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Desktop secret boundary static gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const preload = fs.readFileSync('electron/preload.js', 'utf8');
          const store = fs.readFileSync('electron/lib/providerSecretStore.js', 'utf8');
          const ipc = fs.readFileSync('electron/lib/providerCredentials.js', 'utf8');

          if (/orbiCredentials[\s\S]*getMuapiKey\s*:/.test(preload)) {
            throw new Error('Renderer bridge must not expose MuAPI secret reads');
          }
          for (const method of ['getMuapiReadiness', 'setMuapiKey', 'deleteMuapiKey']) {
            if (!preload.includes(method)) throw new Error(`Missing narrow credential bridge method: ${method}`);
          }
          if (!store.includes("backend === 'basic_text'")) {
            throw new Error('Linux basic_text rejection policy missing');
          }
          if (!ipc.includes("url.startsWith('file://')")) {
            throw new Error('Provider credential IPC origin validation missing');
          }
          console.log('S3_DESKTOP_SECRET_BOUNDARY_GATE PASS');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Electron syntax gate
        run: find electron -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Root tests
        run: node --test tests/*.test.js

      - name: Deterministic lint
        run: npm run lint -- --max-warnings 10

      - name: Build workspaces
        run: npm run build:packages

      - name: Build Next application
        run: npm run build

      - name: Build Electron renderer
        run: npm run vite:build

      - name: Production security gate
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/prod-audit.json
          set -e
          node - <<'NODE'
          const a = require('/tmp/prod-audit.json');
          const v = a.metadata?.vulnerabilities || {};
          console.log('PROVIDER_CREDENTIAL_S3_PROD_AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            throw new Error('Critical/high production findings remain');
          }
          NODE
